# Builds an unsigned PixelIsland.ipa on a macOS runner.
# Sign it on the phone (ESign or similar) with your own certificate.
#
# Every push uploads the .ipa as a workflow artifact and refreshes the
# "latest" pre-release, so there is always a direct download link:
#   https://github.com/<owner>/<repo>/releases/download/latest/PixelIsland.ipa
name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check generated sprites are up to date
        run: |
          python3 tools/sprites/generate.py
          git diff --exit-code -- Shared/Sprites

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PixelIsland.xcodeproj \
            -scheme PixelIsland \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Show registered App Intents
        run: |
          APP=build/Build/Products/Release-iphoneos/PixelIsland.app
          find "$APP" -name "extract.actionsdata" | while read -r f; do
            echo "== $f"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sorted(d.get('actions', {}).keys()))" "$f" || true
          done

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PixelIsland.app
          test -d "$APP/PlugIns/PixelIslandWidget.appex"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../PixelIsland.ipa Payload)
          ls -lh PixelIsland.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelIsland-ipa
          path: PixelIsland.ipa
          if-no-files-found: error

      - name: Publish "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PixelIsland.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Pixel Island — последняя сборка" \
            --notes "Неподписанный .ipa из коммита ${GITHUB_SHA::7} (ветка ${GITHUB_REF_NAME}). Подпиши в ESign своим сертификатом."
